name: Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: hasangenc0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: bordod
            image: ghcr.io/hasangenc0/bordod
            dockerfile: deploy/bordo/Dockerfile.bordod
          - name: bordo-agent
            image: ghcr.io/hasangenc0/bordo-agent
            dockerfile: deploy/bordo/Dockerfile.agent
          - name: bordo-console
            image: ghcr.io/hasangenc0/bordo-console
            dockerfile: deploy/bordo/Dockerfile.console

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
