name: Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: hasangenc0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: bordod
            image: ghcr.io/hasangenc0/bordod
            dockerfile: deploy/bordo/Dockerfile.bordod
          - name: bordo-agent
            image: ghcr.io/hasangenc0/bordo-agent
            dockerfile: deploy/bordo/Dockerfile.agent
          - name: bordo-sandbox
            image: ghcr.io/hasangenc0/bordo-sandbox
            dockerfile: deploy/bordo/Dockerfile.sandbox
          - name: bordo-console
            image: ghcr.io/hasangenc0/bordo-console
            dockerfile: deploy/bordo/Dockerfile.console
          - name: bordo-reconciler
            image: ghcr.io/hasangenc0/bordo-reconciler
            dockerfile: deploy/bordo/Dockerfile.reconciler

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
