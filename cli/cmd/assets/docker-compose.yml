# Docker keeps container logs forever by default; cap them at 3 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Published ports bind to loopback by default. Docker publishes with its own iptables rules, which
# bypass ufw, so "0.0.0.0" means open to the internet whatever the host firewall says. Reach the
# stack through an SSH tunnel, Tailscale (set BIND_ADDR to the tailscale IP) or the TLS proxy below.
services:
  bordod:
    image: ${BORDOD_IMAGE:-ghcr.io/hasangenc0/bordod:latest}
    ports:
      - "${BORDOD_BIND:-${BIND_ADDR:-127.0.0.1}}:${BORDOD_PORT:-7401}:7401"
    environment:
      - BORDO_SERVER_PORT=7401
      - BORDO_STORE_PATH=/data/bordod.db
      - BORDO_TEMPLATE_ROOT=/templates
      - BORDO_VM_URL=http://victoriametrics:8428
      - BORDO_LOKI_URL=http://loki:3100
      - BORDO_TEMPO_URL=http://tempo:3200
      - BORDO_AUTH_TOKEN=${BORDO_INTERNAL_TOKEN:?BORDO_INTERNAL_TOKEN must be set; without it the API would be open}
      # OAuth App client id for "Connect GitHub" in the console (Device Flow enabled).
      - BORDO_GITHUB_CLIENT_ID=${BORDO_GITHUB_CLIENT_ID:-}
    volumes:
      - bordod-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7401/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  bordo-agent:
    image: ${AGENT_IMAGE:-ghcr.io/hasangenc0/bordo-agent:latest}
    ports:
      - "${AGENT_BIND:-${BIND_ADDR:-127.0.0.1}}:${AGENT_PORT:-7402}:7402"
    environment:
      - BORDO_AGENT_PORT=7402
      - BORDO_CP_URL=http://bordod:7401
      - BORDO_TOKEN=${BORDO_INTERNAL_TOKEN:?BORDO_INTERNAL_TOKEN must be set}
      - BORDO_AGENT_TOKEN=${BORDO_AGENT_TOKEN:-${BORDO_INTERNAL_TOKEN}}
      - BORDO_CHAT_DB=/data/agent-chats.db
      - BORDO_WORKSPACE=/data/workspaces
      - BORDO_SANDBOX_URL=http://bordo-sandbox:7403
    networks:
      - default
      - sandbox
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - agent-data:/data
      - agent-workspaces:/data/workspaces
    depends_on:
      bordod:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Runs the agent's shell commands (code_exec). It sees a read-only copy of the checkouts, holds no
  # tokens, runs commands as an unprivileged user, and sits on its own network that cannot reach
  # bordod or the other services; the agent is the only container it shares a network with.
  bordo-sandbox:
    image: ${SANDBOX_IMAGE:-ghcr.io/hasangenc0/bordo-sandbox:latest}
    environment:
      - BORDO_WORKSPACE=/workspaces
    volumes:
      - agent-workspaces:/workspaces:ro
      - sandbox-cache:/cache
    networks:
      - sandbox
    tmpfs:
      - /work:size=1g,mode=0755
      - /tmp:size=256m
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512
    restart: unless-stopped
    logging: *default-logging

  bordo-console:
    image: ${CONSOLE_IMAGE:-ghcr.io/hasangenc0/bordo-console:latest}
    ports:
      - "${CONSOLE_BIND:-${BIND_ADDR:-127.0.0.1}}:${CONSOLE_PORT:-3000}:80"
    environment:
      - BORDO_AGENT_TOKEN=${BORDO_AGENT_TOKEN:-${BORDO_INTERNAL_TOKEN}}
      - BORDO_CONSOLE_PASSWORD=${BORDO_CONSOLE_PASSWORD:?run 'bordo platform up' to generate one, or set it in .env}
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      - bordo-agent
    restart: unless-stopped
    logging: *default-logging

  # Optional TLS front door: `docker compose --profile tls up -d` with BORDO_DOMAIN set (DNS for the
  # domain and api.<domain> pointing here). Caddy gets Let's Encrypt certificates on its own. With
  # it, keep the BIND_ADDR default so only 80/443 are public.
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["tls"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{$$BORDO_DOMAIN} {\n  reverse_proxy bordo-console:80\n}\napi.{$$BORDO_DOMAIN} {\n  reverse_proxy bordod:7401\n}\n' > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    environment:
      - BORDO_DOMAIN=${BORDO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - bordo-console
    restart: unless-stopped
    logging: *default-logging

networks:
  sandbox: {}

volumes:
  bordod-data:
  agent-data:
  agent-workspaces:
  sandbox-cache:
  caddy-data:
  caddy-config:
