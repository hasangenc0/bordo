services:
  bordod:
    image: ${BORDOD_IMAGE:-ghcr.io/hasangenc0/bordod:latest}
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.bordod
    ports:
      - "${BORDOD_PORT:-7401}:7401"
    environment:
      - BORDO_SERVER_PORT=7401
      - BORDO_STORE_PATH=/data/bordod.db
      - BORDO_TEMPLATE_ROOT=/templates
      - BORDO_VM_URL=http://victoriametrics:8428
      - BORDO_LOKI_URL=http://loki:3100
      - BORDO_TEMPO_URL=http://tempo:3200
      - BORDO_AUTH_TOKEN=${BORDO_INTERNAL_TOKEN}
      # - BORDO_BASE_URL=${BORDO_BASE_URL}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # - BORDO_REGISTRY=${BORDO_REGISTRY}
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - bordod-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7401/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bordo-agent:
    image: ${AGENT_IMAGE:-ghcr.io/hasangenc0/bordo-agent:latest}
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.agent
    ports:
      - "${AGENT_PORT:-7402}:7402"
    environment:
      - BORDO_AGENT_PORT=7402
      - BORDO_CP_URL=http://bordod:7401
      - BORDO_TOKEN=${BORDO_INTERNAL_TOKEN}
      - BORDO_AGENT_TOKEN=${BORDO_INTERNAL_TOKEN}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BORDO_CHAT_DB=/data/agent-chats.db
      - BORDO_WORKSPACE=/data/workspaces
      - BORDO_SANDBOX_URL=http://bordo-sandbox:7403
    networks:
      - default
      - sandbox
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - agent-data:/data
      - agent-workspaces:/data/workspaces
    depends_on:
      bordod:
        condition: service_healthy
    restart: unless-stopped

  # Runs the agent's shell commands (code_exec). It sees a read-only copy of the checkouts, holds no
  # tokens, runs commands as an unprivileged user, and sits on its own network that cannot reach
  # bordod or the other services; the agent is the only container it shares a network with.
  bordo-sandbox:
    image: ${SANDBOX_IMAGE:-ghcr.io/hasangenc0/bordo-sandbox:latest}
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.sandbox
    environment:
      - BORDO_WORKSPACE=/workspaces
    volumes:
      - agent-workspaces:/workspaces:ro
      - sandbox-cache:/cache
    networks:
      - sandbox
    tmpfs:
      - /work:size=1g,mode=0755
      - /tmp:size=256m
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512
    restart: unless-stopped

  bordo-console:
    image: ${CONSOLE_IMAGE:-ghcr.io/hasangenc0/bordo-console:latest}
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.console
    ports:
      - "${CONSOLE_PORT:-3000}:80"
    environment:
      - BORDO_AGENT_TOKEN=${BORDO_INTERNAL_TOKEN}
      - BORDO_CONSOLE_PASSWORD=${BORDO_CONSOLE_PASSWORD:?run 'bordo platform up' to generate one, or set it in .env}
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      - bordo-agent
    restart: unless-stopped

networks:
  sandbox: {}

volumes:
  bordod-data:
  agent-data:
  agent-workspaces:
  sandbox-cache:
