# Works with Docker Desktop and Rancher Desktop (use 'docker compose up --build')
# For Rancher Desktop: enable dockerd (moby) in Preferences → Container Engine

services:
  bordod:
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.bordod
    image: bordo-io/bordod:local
    ports:
      - "${BORDOD_PORT:-7401}:7401"
    environment:
      - BORDO_SERVER_PORT=7401
      - BORDO_STORE_PATH=/data/bordod.db
      - BORDO_TEMPLATE_ROOT=/templates
      - BORDO_VM_URL=http://victoriametrics:8428
      - BORDO_LOKI_URL=http://loki:3100
      - BORDO_TEMPO_URL=http://tempo:3200
      # Internal service token — only used on the Docker network.
      # Auto-generated by install.sh; users never need to touch this.
      - BORDO_AUTH_TOKEN=${BORDO_INTERNAL_TOKEN}
      # Advanced overrides: uncomment to bypass the settings store.
      # - BORDO_BASE_URL=${BORDO_BASE_URL}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # - BORDO_REGISTRY=${BORDO_REGISTRY}
      # Tune Go GC to be more aggressive: halves heap headroom, saves ~20 MB.
      - GOGC=50
    mem_limit: 192m
    memswap_limit: 192m
    volumes:
      - bordod-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7401/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  bordo-agent:
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.agent
    image: bordo-io/bordo-agent:local
    ports:
      - "${AGENT_PORT:-7402}:7402"
    environment:
      - BORDO_AGENT_PORT=7402
      - BORDO_CP_URL=http://bordod:7401
      # Use the same internal token for agent→bordod calls.
      - BORDO_TOKEN=${BORDO_INTERNAL_TOKEN}
      - BORDO_AGENT_TOKEN=${BORDO_INTERNAL_TOKEN}
      # DEEPSEEK_API_KEY is fetched from bordod at startup (set via 'bordo setup').
      # Uncomment below only to override it without going through the wizard.
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BORDO_CHAT_DB=/data/agent-chats.db
      - GOGC=50
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - agent-data:/data
    depends_on:
      bordod:
        condition: service_healthy
    restart: unless-stopped

  bordo-console:
    build:
      context: ../..
      dockerfile: deploy/bordo/Dockerfile.console
    image: bordo-io/bordo-console:local
    ports:
      - "${CONSOLE_PORT:-3000}:80"
    environment:
      # nginx uses this to add Authorization headers when proxying to the agent.
      # No Node.js BFF — nginx proxies directly to bordo-agent on the Docker network.
      - BORDO_AGENT_TOKEN=${BORDO_INTERNAL_TOKEN}
    mem_limit: 32m
    memswap_limit: 32m
    depends_on:
      - bordo-agent
    restart: unless-stopped

volumes:
  bordod-data:
  agent-data:
