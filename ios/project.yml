name: Bordo
options:
  bundleIdPrefix: io.bordo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
targets:
  Bordo:
    type: application
    platform: iOS
    sources: [Bordo]
    dependencies:
      - package: Citadel
      - package: swift-nio
        product: NIO
      - package: swift-nio
        product: NIOCore
      - package: swift-crypto
        product: Crypto
      - package: swift-nio-ssh
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bordo.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bordo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Bordo/Info.plist
      properties:
        CFBundleDisplayName: Bordo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The app only ever speaks plain HTTP/WS to its own loopback end of the SSH tunnel.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BordoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BordoTests]
    dependencies:
      - target: Bordo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.bordo.ios.tests
schemes:
  Bordo:
    build:
      targets:
        Bordo: all
    test:
      targets: [BordoTests]
